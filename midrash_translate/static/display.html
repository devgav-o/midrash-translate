<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} — live</title>
<style>
  :root {
    --bg: #0f1115;
    --fg: #f2f4f8;
    --dim: #7c8798;
    --accent: #6ea8fe;
    --font-size: {{font_size}}px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: .6rem;
    padding: .5rem 1.2rem; font-size: 15px; color: var(--dim);
    border-bottom: 1px solid #1e2330; flex: 0 0 auto; direction: ltr;
  }
  header .title { color: var(--fg); font-weight: 600; letter-spacing: .02em; }
  header .spacer { flex: 1; }
  header .age { font-variant-numeric: tabular-nums; opacity: .75; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #d4574d; }
  #dot.on { background: #4fb477; }
  #lines {
    flex: 1 1 auto; overflow-y: auto; padding: 1.2rem 2.5rem 45vh;
    /* deliberately NOT scroll-behavior:smooth -- animated scrolling is driven by
       the frame loop, which browsers throttle in unfocused windows, leaving a
       projector stranded above the newest line */
  }
  .line {
    font-size: var(--font-size); line-height: 1.45;
    margin: 0 0 .55em; white-space: pre-wrap; word-wrap: break-word;
  }
  .line .who {
    display: inline-block; font-size: .52em; font-weight: 700;
    letter-spacing: .06em; color: var(--accent); background: #1b2434;
    padding: .12em .5em; border-radius: .3em; margin-inline-end: .5em;
    vertical-align: .18em; white-space: nowrap;
  }
  .line.pending { color: var(--dim); }
  .line.pending::after {
    content: "…"; opacity: .6; animation: blink 1.1s ease-in-out infinite;
  }
  .line .src {
    display: block; font-size: .42em; color: var(--dim);
    margin-top: .15em; direction: ltr; text-align: start;
  }
  @keyframes blink { 0%, 100% { opacity: .25 } 50% { opacity: .9 } }
  #jump {
    position: fixed; bottom: 1.5rem; inset-inline-end: 1.5rem; display: none;
    padding: .6rem 1rem; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: #0f1115; font: 600 15px/1 system-ui;
  }
  #jump.show { display: block; }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <span class="title">{{name}}</span>
  <span class="spacer"></span>
  <span class="age" id="age"></span>
  <span id="hint">+ / −  font · S source · F fullscreen</span>
</header>
<main id="lines" dir="{{dir}}"></main>
<button id="jump">↓ live</button>

<script>
const LANG = "{{lang}}";
const MAX_LINES = {{max_lines}};
let showSource = {{show_source}};

const linesEl = document.getElementById("lines");
const dot = document.getElementById("dot");
const jump = document.getElementById("jump");

let order = [];            // paragraph ids, in document order
const lines = new Map();   // id -> {text, src, pending}
let following = true;      // auto-scroll unless the viewer scrolled up

function scrollToBottom() {
  // direct assignment, never scrollTo({behavior:'smooth'}), so it lands even
  // when the window is unfocused and the frame loop is throttled
  linesEl.scrollTop = linesEl.scrollHeight;
}

function render() {
  const frag = document.createDocumentFragment();
  const visible = order.slice(-MAX_LINES);
  for (const id of visible) {
    const d = lines.get(id);
    if (!d) continue;
    if (!d.src || !d.src.trim()) continue;
    const p = document.createElement("p");
    p.className = "line" + (d.pending || !d.text ? " pending" : "");
    if (d.speaker) {
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = d.speaker;
      p.appendChild(who);
    }
    // appendChild, not textContent, so the speaker chip survives
    p.appendChild(document.createTextNode(d.text || ""));
    if (showSource && d.src) {
      const s = document.createElement("span");
      s.className = "src";
      s.textContent = d.src;
      p.appendChild(s);
    }
    frag.appendChild(p);
  }
  linesEl.replaceChildren(frag);
  if (following) scrollToBottom();
}

function applyLines(items) {
  for (const item of items || []) lines.set(item.id, item);
}

let sock = null;
let keepalive = null;

function connect() {
  if (sock && (sock.readyState === 0 || sock.readyState === 1)) return;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/${LANG}`);
  sock = ws;

  ws.onopen = () => {
    dot.classList.add("on");
    clearInterval(keepalive);
    // keeps intermediaries from dropping an idle socket between paragraphs
    keepalive = setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 20000);
  };
  ws.onclose = () => {
    dot.classList.remove("on");
    clearInterval(keepalive);
    setTimeout(connect, 1000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    lastMessageAt = Date.now();
    messageCount++;
    const msg = JSON.parse(ev.data);
    if (msg.type === "snapshot") {
      lines.clear();
      order = msg.lines.map((l) => l.id);
      applyLines(msg.lines);
    } else if (msg.type === "patch") {
      if (msg.order) {
        order = msg.order;
        const keep = new Set(order);
        for (const id of [...lines.keys()]) if (!keep.has(id)) lines.delete(id);
      }
      applyLines(msg.lines);
    }
    render();
  };
}

linesEl.addEventListener("scroll", () => {
  const atBottom = linesEl.scrollHeight - linesEl.scrollTop - linesEl.clientHeight < 80;
  following = atBottom;
  jump.classList.toggle("show", !atBottom);
});
jump.addEventListener("click", () => {
  following = true;
  linesEl.scrollTop = linesEl.scrollHeight;
  jump.classList.remove("show");
});

const root = document.documentElement;
function bumpFont(delta) {
  const cur = parseFloat(getComputedStyle(root).getPropertyValue("--font-size"));
  root.style.setProperty("--font-size", Math.max(16, Math.min(160, cur + delta)) + "px");
  if (following) linesEl.scrollTop = linesEl.scrollHeight;
}
document.addEventListener("keydown", (e) => {
  if (e.key === "+" || e.key === "=") bumpFont(4);
  else if (e.key === "-" || e.key === "_") bumpFont(-4);
  else if (e.key.toLowerCase() === "s") { showSource = !showSource; render(); }
  else if (e.key.toLowerCase() === "f") {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  }
});

// A window that is visible but NOT focused -- the split-screen case, and every
// projector on a second monitor -- never fires visibilitychange. So recover on
// window focus as well, or the page only catches up when someone clicks it.
function resync() {
  connect();
  render();
  if (following) scrollToBottom();
  requestWakeLock();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") resync();
});
window.addEventListener("focus", resync);
window.addEventListener("pageshow", resync);

// Shows how long since the last message actually arrived. If this keeps ticking
// up while the transcriber is typing, the page is not receiving; if it stays
// near zero but the text looks stale, the browser is not repainting.
const ageEl = document.getElementById("age");
let lastMessageAt = Date.now();
let messageCount = 0;
setInterval(() => {
  const secs = Math.round((Date.now() - lastMessageAt) / 1000);
  ageEl.textContent = `${messageCount} msg · ${secs}s ago`;
}, 1000);

// stop the projector machine blanking the screen mid-lecture
let wakeLock = null;
async function requestWakeLock() {
  if (!("wakeLock" in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) { /* not served over https, or unsupported: harmless */ }
}

connect();
requestWakeLock();
</script>
</body>
</html>
